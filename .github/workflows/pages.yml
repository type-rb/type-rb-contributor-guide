name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the contributor guide
        run: bun run check

      - name: Check required pages
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/en/index.html
          test -s dist/en/start-contributing/index.html
          test -s dist/en/contributor-workflow/index.html
          test -s dist/en/glossary/index.html
          test -s dist/en/foundations/how-a-compiler-works/index.html
          test -s dist/en/foundations/reading-a-changing-codebase/index.html
          test -s dist/en/foundations/testing-compiler-changes/index.html
          test -s dist/en/reference-compiler/map/index.html
          test -s dist/en/reference-compiler/change-journey/index.html
          test -s dist/en/reference-compiler/diagnostics/index.html
          test -s dist/en/reference-compiler/trace/index.html
          test -s dist/en/reference-compiler/code-clinic/index.html
          test -s dist/en/native-compiler/map/index.html
          test -s dist/en/native-compiler/change-journey/index.html
          test -s dist/en/native-compiler/evidence/index.html
          test -s dist/en/native-compiler/trace/index.html
          test -s dist/en/native-compiler/code-clinic/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
